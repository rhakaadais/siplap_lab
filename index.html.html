<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIPLAB - Sistem Pendataan Informasi Laboratorium Kesehatan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f8f8;--card:#fff;--ink:#12263a;--mut:#5b6b7a;--line:#d9e3e6;--pri:#0f766e;--pi:#fff;--w:#92400e;--wb:#fef3c7;--o:#166534;--ob:#dcfce7;--b:#b91c1c;--bb:#fee2e2;--i:#1d4ed8;--ib:#dbeafe;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a22;--card:#14252f;--ink:#e6eef2;--mut:#9fb2bd;--line:#26404d;--pri:#2dd4bf;--pi:#06201d;--w:#fbbf24;--wb:#3a2c0b;--o:#86efac;--ob:#0f3320;--b:#fca5a5;--bb:#3b1515;--i:#93c5fd;--ib:#142a4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a22;--card:#14252f;--ink:#e6eef2;--mut:#9fb2bd;--line:#26404d;--pri:#2dd4bf;--pi:#06201d;--w:#fbbf24;--wb:#3a2c0b;--o:#86efac;--ob:#0f3320;--b:#fca5a5;--bb:#3b1515;--i:#93c5fd;--ib:#142a4d;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--pri);padding:0 8px}.sub{font-size:12px;color:var(--mut);padding:0 8px 14px}
nav button.m{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:500}
nav button.m:hover{background:var(--bg)}nav button.m.on{background:var(--pri);color:var(--pi)}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
main{padding:28px;max-width:1100px;width:100%}h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.lead{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px}
.stat b{display:block;font-size:28px}.stat span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:13px}
form.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
textarea{min-height:84px;resize:vertical}
.full{grid-column:1/-1}.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:8px;color:var(--ink)}.chk input{width:auto}
button.p,button.s{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--pri);cursor:pointer}
button.p{background:var(--pri);color:var(--pi)}button.s{background:transparent;color:var(--pri)}button.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--i);outline-offset:2px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.t-Diajukan{background:var(--wb);color:var(--w)}.t-Selesai,.t-Normal{background:var(--ob);color:var(--o)}.t-Tinggi,.t-Rendah{background:var(--bb);color:var(--b)}
.login{max-width:430px;margin:8vh auto;padding:0 16px}.hint{font-size:13px;color:var(--mut);margin-top:14px}.err{color:var(--b);font-size:13px;min-height:18px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:start center;padding:16px;z-index:9;overflow:auto}
.sheet{background:#fff;color:#111;max-width:600px;width:100%;border-radius:10px;padding:24px}.sheet table td,.sheet table th{color:#111;border-color:#ccc}.sheet label{color:#444}.sheet input,.sheet textarea{background:#fff;color:#111;border-color:#bbb}.sheet h2{font-size:18px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:10}
.note{font-size:12px;color:#555;margin-top:12px}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.brand,.sub{width:100%}.who{display:none}main{padding:16px}}
@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}.ov{position:static;background:none;display:block}.sheet{position:absolute;left:0;top:0}.np{display:none!important}}
:root{--grad:linear-gradient(135deg,#0e7490 0%,#0f766e 55%,#14b8a6 100%);--sh:0 8px 28px rgba(14,116,144,.12)}
.lg{display:flex;align-items:center;gap:10px}
nav{background:var(--grad);border:0;color:#fff}
nav .brand{color:#fff;font-size:21px;padding:4px 8px}nav .sub{color:rgba(255,255,255,.78)}
nav button.m{display:flex;align-items:center;gap:10px;color:#fff;padding:10px 12px;border-radius:10px}
nav button.m:hover{background:rgba(255,255,255,.16)}nav button.m.on{background:#fff;color:#0f766e}
nav .who{color:rgba(255,255,255,.88);border-color:rgba(255,255,255,.28)}nav .who button.s{color:#fff;border-color:rgba(255,255,255,.7)}
.banner{background:var(--grad);color:#fff;border-radius:16px;padding:28px;margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.banner::after{content:"";position:absolute;right:-40px;top:-50px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.13)}
.banner::before{content:"";position:absolute;right:90px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.09)}
.banner h1{color:#fff;margin:0 0 4px;font-size:26px}.banner p{margin:0;opacity:.92;position:relative}
.card{border-radius:14px;box-shadow:var(--sh)}
.stat{border:1px solid var(--line);border-top:4px solid #14b8a6;border-radius:14px;box-shadow:var(--sh)}
.stat:nth-child(2){border-top-color:#f59e0b}.stat:nth-child(3){border-top-color:#10b981}
.stat b{font-size:30px;color:var(--pri)}
th{text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;background:var(--bg)}
tbody tr:hover td{background:rgba(20,184,166,.07)}
button.p{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.28)}
button.p:hover{filter:brightness(1.07)}button.s:hover{background:rgba(20,184,166,.1)}
input:focus,select:focus,textarea:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.22);outline:0}
.tag{padding:3px 11px}
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.hero{background:var(--grad);color:#fff;padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:-90px;bottom:-110px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}.hero .lg{font-size:24px;font-weight:700;letter-spacing:.02em}
.hero h2{font-size:36px;line-height:1.18;margin:0;color:#fff;max-width:480px}.hero p{margin:0;opacity:.93;max-width:460px;font-size:16px}
.feat{display:grid;gap:12px;max-width:480px}.feat div{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.15);padding:13px 16px;border-radius:12px}.feat svg{flex:none}
.panel{display:grid;place-items:center;padding:32px 20px;background:var(--bg)}
.login{margin:0;width:100%;max-width:430px;padding:0}.login h1{font-size:26px}
.tabs{background:var(--bg);padding:4px;border-radius:12px;gap:4px}.tabs button{border:0}
@media (max-width:860px){.auth{grid-template-columns:1fr}.hero{padding:30px 22px;gap:14px}.hero h2{font-size:25px}.feat{display:none}nav .brand.lg{width:100%}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const seed=()=>({u:[{u:"petugas",p:"petugas123",n:"Rina Analis",r:"petugas"},{u:"pasien",p:"pasien123",n:"Siti Aminah",r:"pasien",pid:"RM-0001"}],
pas:[{id:"RM-0001",n:"Siti Aminah",lh:"1985-04-12",jk:"P",hp:"081234567890",al:"Jl. Sudirman 12, Palembang"}],
jen:[{k:"HB",n:"Hemoglobin",s:"g/dL",ref:"12–16",lo:12,hi:16},{k:"GDS",n:"Gula darah sewaktu",s:"mg/dL",ref:"< 200",hi:200},{k:"KOL",n:"Kolesterol total",s:"mg/dL",ref:"< 200",hi:200},{k:"AU",n:"Asam urat",s:"mg/dL",ref:"3,5–7,2",lo:3.5,hi:7.2},{k:"TG",n:"Trigliserida",s:"mg/dL",ref:"< 150",hi:150}],
k:[{id:"KLH-001",tgl:today(),pid:"RM-0001",keluhan:"Sering haus dan mudah lelah",lama:"1–2 minggu",kb:["GDS","KOL"],cat:"Ingin cek gula darah dan kolesterol",st:"Selesai",items:[{k:"GDS",v:"245"},{k:"KOL",v:"190"}],dx:"Kadar gula darah sewaktu meningkat, dugaan awal hiperglikemia. Kolesterol total normal.",sr:"Atur pola makan, kurangi gula, dan konsultasi ke dokter untuk pemeriksaan lanjutan (HbA1c).",by:"Rina Analis",tglh:today()}]});
let S;try{S=JSON.parse(localStorage.getItem("siplab2")||"null")}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem("siplab2",JSON.stringify(S))}catch(e){}};
let me=null,pg="dash",err="",tab="in";
const MENU={pasien:[["dash","Beranda"],["keluhan","Keluhan & kebutuhan"],["hasil","Hasil diagnosa"]],petugas:[["dash","Beranda"],["antri","Antrian keluhan"],["hasil","Hasil diagnosa"],["pasien","Data pasien"]]};
const ROLE={pasien:"Pasien",petugas:"Petugas / Analis Lab"};
const J=k=>S.jen.find(x=>x.k==k)||{n:k,s:"",ref:""},P=id=>S.pas.find(x=>x.id==id)||{n:id};
const flag=it=>{const j=J(it.k),v=parseFloat(String(it.v).replace(",","."));if(isNaN(v))return"";if(j.hi!=null&&v>j.hi)return"Tinggi";if(j.lo!=null&&v<j.lo)return"Rendah";return"Normal"};
const tag=s=>s?`<span class="tag t-${s}">${s}</span>`:"";
const nid=(p,a,n)=>p+String(a.length+1).padStart(n,"0");
const table=(h,rows,empty)=>rows.length?`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`:`<p class="lead" style="margin:0">${empty}</p>`;
const head=(t,s)=>`<h1>${t}</h1><p class="lead">${s}</p>`;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function modal(h){closeM();const o=document.createElement("div");o.className="ov";o.id="mod";o.innerHTML=`<div class="sheet">${h}</div>`;document.body.appendChild(o)}
function closeM(){const m=$("#mod");if(m)m.remove()}
const sv=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={dash:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',keluhan:'<path d="M9 4h6v3H9z"/><path d="M7 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1"/><path d="M9 13h6M9 17h4"/>',antri:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',hasil:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',pasien:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',print:'<path d="M7 9V3h10v6"/><rect x="5" y="9" width="14" height="8" rx="1"/><path d="M7 14h10v7H7z"/>',flask:'<path d="M9 3h6M10 3v6.5L5.6 18a2 2 0 0 0 1.8 3h9.2a2 2 0 0 0 1.8-3L14 9.5V3"/><path d="M8 14h8"/>'};
const ic=k=>sv(IC[k]),LOGO=sv(IC.flask).replace('width="20" height="20"','width="32" height="32"');
function go(p){pg=p;render()}
function setTab(t){tab=t;err="";render()}
function login(e){e.preventDefault();const f=e.target,u=S.u.find(x=>x.u.toLowerCase()==f.u.value.trim().toLowerCase()&&x.p==f.p.value);if(!u){err="Username atau kata sandi salah.";return render()}me=u;err="";pg="dash";render()}
function reg(e){e.preventDefault();const f=e.target,un=f.u.value.trim();
if(S.u.some(x=>x.u.toLowerCase()==un.toLowerCase())){err="Username sudah dipakai, pilih yang lain.";return render()}
if(f.p.value.length<6){err="Kata sandi minimal 6 karakter.";return render()}
if(f.p.value!=f.p2.value){err="Konfirmasi kata sandi tidak sama.";return render()}
if(!/^[0-9]{9,14}$/.test(f.hp.value.trim())){err="No. HP harus berupa angka 9–14 digit.";return render()}
const id=nid("RM-",S.pas,4);S.pas.push({id,n:f.n.value.trim(),lh:f.lh.value,jk:f.jk.value,hp:f.hp.value.trim(),al:f.al.value.trim()});
S.u.push({u:un,p:f.p.value,n:f.n.value.trim(),r:"pasien",pid:id});save();tab="in";err="";toast("Akun dibuat. No. RM Anda: "+id+". Silakan masuk.");render()}
function logout(){me=null;render()}
function addKlh(e){e.preventDefault();const f=e.target,kb=[...f.querySelectorAll("input[name=j]:checked")].map(x=>x.value);
S.k.push({id:nid("KLH-",S.k,3),tgl:today(),pid:me.pid,keluhan:f.kl.value.trim(),lama:f.lama.value,kb,cat:f.cat.value.trim(),st:"Diajukan"});save();toast("Keluhan dan kebutuhan terkirim");pg="hasil";render()}
function proses(id){const r=S.k.find(x=>x.id==id),p=P(r.pid),js=r.kb.filter(x=>x!="?").length?r.kb.filter(x=>x!="?"):S.jen.map(x=>x.k);
modal(`<h2>Proses ${r.id} - ${esc(p.n)}</h2><p><b>Keluhan:</b> ${esc(r.keluhan)} (${esc(r.lama)})<br><b>Kebutuhan:</b> ${esc(r.cat||"-")}</p><form class="g" style="grid-template-columns:1fr" onsubmit="saveP(event,'${id}')">${js.map(k=>{const j=J(k);return`<label>${esc(j.n)} (rujukan ${esc(j.ref)} ${esc(j.s)})<input name="v_${k}" ${r.kb.includes(k)?"required":'placeholder="Opsional"'}></label>`}).join("")}<label>Diagnosa<textarea name="dx" required></textarea></label><label>Saran<textarea name="sr"></textarea></label><div><button class="p">Simpan hasil diagnosa</button> <button type="button" class="s" onclick="closeM()">Batal</button></div></form>`)}
function saveP(e,id){e.preventDefault();const f=e.target,r=S.k.find(x=>x.id==id),items=S.jen.filter(j=>f["v_"+j.k]&&f["v_"+j.k].value.trim()).map(j=>({k:j.k,v:f["v_"+j.k].value.trim()}));
if(!items.length)return toast("Isi minimal satu nilai hasil");Object.assign(r,{items,dx:f.dx.value.trim(),sr:f.sr.value.trim(),by:me.n,tglh:today(),st:"Selesai"});save();closeM();toast("Hasil diagnosa tersimpan");render()}
function cetak(id){const r=S.k.find(x=>x.id==id),p=P(r.pid);modal(`<h2>Hasil Diagnosa Laboratorium</h2><table><tr><th>No. RM</th><td>${esc(p.id)}</td></tr><tr><th>Nama</th><td>${esc(p.n)}</td></tr><tr><th>Tgl lahir / JK</th><td>${esc(p.lh)} / ${p.jk=="L"?"Laki-laki":"Perempuan"}</td></tr><tr><th>Keluhan</th><td>${esc(r.keluhan)}</td></tr></table><table style="margin-top:14px"><thead><tr><th>Pemeriksaan</th><th>Hasil</th><th>Rujukan</th><th>Ket.</th></tr></thead><tbody>${r.items.map(it=>{const j=J(it.k);return`<tr><td>${esc(j.n)}</td><td><b>${esc(it.v)}</b> ${esc(j.s)}</td><td>${esc(j.ref)}</td><td>${tag(flag(it))}</td></tr>`}).join("")}</tbody></table><p><b>Diagnosa:</b> ${esc(r.dx)}</p><p><b>Saran:</b> ${esc(r.sr||"-")}</p><p style="font-size:13px">Diperiksa oleh ${esc(r.by)} pada ${esc(r.tglh)}</p><p class="note">Hasil ini merupakan informasi awal dari laboratorium. Diagnosa akhir dan terapi ditetapkan oleh dokter.</p><p class="np" style="margin-top:16px"><button class="p" onclick="print()">Cetak / simpan PDF</button> <button class="s" onclick="closeM()">Tutup</button></p>`)}
const mine=()=>S.k.filter(x=>me.r=="petugas"||x.pid==me.pid);
const kbn=r=>r.kb.length?r.kb.map(k=>k=="?"?"Minta disarankan":esc(J(k).n)).join(", "):"-";
const V={
dash(){const m=mine(),c=s=>m.filter(x=>x.st==s).length;return `<div class="banner"><h1>Halo, ${esc(me.n)}</h1><p>${me.r=="pasien"?"Pantau keluhan dan hasil laboratorium Anda dengan mudah.":"Kelola antrian keluhan dan hasil laboratorium pasien."}</p></div>`+`<div class="stats">${me.r=="petugas"?`<div class="stat"><b>${S.pas.length}</b><span>Pasien terdaftar</span></div>`:`<div class="stat"><b>${me.pid}</b><span>Nomor rekam medis Anda</span></div>`}<div class="stat"><b>${c("Diajukan")}</b><span>Keluhan menunggu diproses</span></div><div class="stat"><b>${c("Selesai")}</b><span>Hasil diagnosa tersedia</span></div></div><div class="card"><h2>${me.r=="pasien"?"Mulai dari sini":"Tugas Anda"}</h2><p class="lead" style="margin:0 0 12px">${me.r=="pasien"?"Tuliskan keluhan dan pemeriksaan yang Anda butuhkan, lalu pantau hasilnya di menu Hasil diagnosa.":"Buka antrian untuk memproses keluhan pasien dan mengisi hasil diagnosa."}</p><button class="p" onclick="go('${me.r=="pasien"?"keluhan":"antri"}')">${me.r=="pasien"?"Isi keluhan & kebutuhan":"Lihat antrian"}</button></div>`},
keluhan(){return head("Keluhan & kebutuhan","Ceritakan keluhan Anda dan pilih pemeriksaan yang dibutuhkan.")+`<div class="card"><form class="g" onsubmit="addKlh(event)"><label class="full">Keluhan<textarea name="kl" required placeholder="Contoh: pusing, haus berlebihan, mudah lelah"></textarea></label><label>Sudah berapa lama?<select name="lama"><option>Kurang dari 1 minggu</option><option>1–2 minggu</option><option>Lebih dari 2 minggu</option><option>Lebih dari 1 bulan</option></select></label><div class="full"><label style="margin-bottom:6px">Kebutuhan pemeriksaan</label><div class="chk">${S.jen.map(j=>`<label><input type="checkbox" name="j" value="${j.k}">${esc(j.n)}</label>`).join("")}<label><input type="checkbox" name="j" value="?">Belum tahu, mohon disarankan</label></div></div><label class="full">Catatan kebutuhan (opsional)<textarea name="cat" placeholder="Riwayat penyakit, obat yang diminum, atau kebutuhan khusus"></textarea></label><div class="full"><button class="p">Kirim</button></div></form></div>`},
antri(){const l=S.k.filter(x=>x.st=="Diajukan");return head("Antrian keluhan","Proses keluhan pasien, isi nilai hasil, lalu tulis diagnosa.")+`<div class="card">${table(["No.","Tanggal","Pasien","Keluhan","Kebutuhan",""],l.map(r=>[r.id,r.tgl,esc(P(r.pid).n),esc(r.keluhan),kbn(r),`<button class="p sm" onclick="proses('${r.id}')">Proses</button>`]),"Tidak ada keluhan yang menunggu.")}</div>`},
hasil(){const l=mine();return head("Hasil diagnosa",me.r=="pasien"?"Riwayat keluhan dan hasil diagnosa Anda.":"Seluruh keluhan dan hasil yang sudah diproses.")+`<div class="card">${table(["No.","Tanggal","Pasien","Keluhan","Status",""],l.map(r=>[r.id,r.tgl,esc(P(r.pid).n),esc(r.keluhan),tag(r.st),r.st=="Selesai"?`<button class="s sm" onclick="cetak('${r.id}')">Lihat &amp; cetak</button>`:"Menunggu hasil"]),"Belum ada data. Kirim keluhan terlebih dahulu.")}</div>`},
pasien(){return head("Data pasien","Daftar pasien yang sudah mendaftar.")+`<div class="card">${table(["No. RM","Nama","Tgl lahir","JK","No. HP","Alamat"],S.pas.map(p=>[p.id,esc(p.n),p.lh,p.jk,esc(p.hp),esc(p.al)]),"Belum ada pasien.")}</div>`}};
function render(){const R=$("#root");
if(!me){R.innerHTML=`<div class="auth"><section class="hero"><div class="lg">${LOGO}SIPLAB</div><h2>Layanan laboratorium kesehatan yang cepat dan terpercaya</h2><p>Sampaikan keluhan Anda, ikuti proses pemeriksaan, dan lihat hasil diagnosa kapan saja secara online.</p><div class="feat"><div>${ic('keluhan')}<span>Ajukan keluhan dan kebutuhan pemeriksaan dari mana saja</span></div><div>${ic('hasil')}<span>Hasil laboratorium lengkap dengan nilai rujukan</span></div><div>${ic('print')}<span>Cetak hasil diagnosa kapan pun dibutuhkan</span></div></div></section><div class="panel"><div class="login"><h1 style="margin-bottom:2px">Selamat datang</h1><p class="lead" style="margin-bottom:16px">Masuk atau daftar untuk melanjutkan.</p><div class="card"><div class="tabs"><button class="${tab=="in"?"p":"s"}" onclick="setTab('in')">Masuk</button><button class="${tab=="up"?"p":"s"}" onclick="setTab('up')">Daftar</button></div>${tab=="in"?`<form class="g" style="grid-template-columns:1fr" onsubmit="login(event)"><label>Username<input name="u" autocomplete="username" required></label><label>Kata sandi<input name="p" type="password" autocomplete="current-password" required></label><div class="err" role="alert">${esc(err)}</div><button class="p">Masuk</button></form><p class="hint">Belum punya akun? Pilih tab Daftar untuk membuat akun pasien.</p>`:`<form class="g" style="grid-template-columns:1fr" onsubmit="reg(event)"><label>Nama lengkap<input name="n" required></label><label>Tanggal lahir<input name="lh" type="date" required></label><label>Jenis kelamin<select name="jk"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></label><label>No. HP<input name="hp" inputmode="numeric" required></label><label>Alamat<input name="al" required></label><label>Username<input name="u" autocomplete="username" required></label><label>Kata sandi (min. 6 karakter)<input name="p" type="password" autocomplete="new-password" required></label><label>Ulangi kata sandi<input name="p2" type="password" autocomplete="new-password" required></label><div class="err" role="alert">${esc(err)}</div><button class="p">Buat akun pasien</button></form>`}</div></div></div></div>`;return}
if(!MENU[me.r].some(m=>m[0]==pg))pg="dash";
R.innerHTML=`<div class="app"><nav><div class="brand lg">${LOGO}SIPLAB</div><div class="sub">Laboratorium Kesehatan</div>${MENU[me.r].map(m=>`<button class="m ${m[0]==pg?"on":""}" onclick="go('${m[0]}')">${ic(m[0])}${m[1]}</button>`).join("")}<div class="who"><b>${esc(me.n)}</b><br>${ROLE[me.r]}<br><button class="s sm" style="margin-top:8px" onclick="logout()">Keluar</button></div></nav><main>${V[pg]()}</main></div>`}
render();
</script></body></html>
